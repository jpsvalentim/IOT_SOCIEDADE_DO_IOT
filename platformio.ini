[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM8
upload_protocol = esptool  ; Suporte a upload via USB; altere para 'espota' para OTA em produção
board_build.partitions = minimal_spiffs.csv  ; Partição menor para economizar flash
board_build.f_cpu = 160MHz  ; Reduz consumo de energia (padrão é 240MHz)
build_flags =
    -DCORE_DEBUG_LEVEL=0  ; Desativa logs do ESP32 core em produção
    -DDEBUG=0  ; Permite desativar Serial.print condicionalmente no código
lib_deps =
    adafruit/Adafruit BMP280 Library@^2.6.8  ; Versão estável para BMP280
    adafruit/Adafruit MPU6050@^2.0.6  ; Versão estável para MPU6050
    bblanchon/ArduinoJson@^6.21.4  ; Última versão estável do ArduinoJson
    adafruit/DHT sensor library@^1.4.6  ; Versão estável para DHT
    khoih-prog/ESP_WiFiManager@^1.12.1  ; Versão estável para gerenciamento WiFi
    knolleary/PubSubClient@^2.8.0  ; Última versão estável do PubSubClient