[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_protocol = esptool ; Suporta upload via USB; mude para 'espota' para OTA em produção
board_build.partitions = minimal_spiffs.csv ; Menor partição para economizar flash
board_build.f_cpu = 160MHz ; Reduz consumo de energia (padrão é 240MHz)
build_flags =
    -DCORE_DEBUG_LEVEL=0 ; Desativa logs em produção (0 = nenhum, 5 = verbose)
    -DDEBUG=0 ; Desativa Serial.print condicionalmente
lib_deps =
    adafruit/Adafruit BMP085 Library@^1.2.2 ; Versão fixa
    adafruit/Adafruit MPU6050@^2.0.6
    adafruit/DHT sensor library@^1.4.6 ; Apenas DHT.h necessário
    bblanchon/ArduinoJson@^6.21.4
    knolleary/PubSubClient@^2.8
    khoih-prog/ESP_WiFiManager@^1.12.1